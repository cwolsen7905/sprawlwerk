name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sim-tests:
    name: Simulation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Only the engine-agnostic projects: no Godot needed on the runner.
      - name: Restore
        run: dotnet restore tests/SprawlWerk.Sim.Tests/SprawlWerk.Sim.Tests.csproj

      - name: Simulation has no Godot reference
        run: tools/check-sim-no-godot.sh

      - name: Test
        run: dotnet test tests/SprawlWerk.Sim.Tests/SprawlWerk.Sim.Tests.csproj --no-restore --logger "console;verbosity=normal"
